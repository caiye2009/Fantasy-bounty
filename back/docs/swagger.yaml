basePath: /api/v1
definitions:
  auth.DemoLoginRequest:
    properties:
      phone:
        type: string
      role:
        enum:
        - supplier
        - client
        type: string
    required:
    - phone
    - role
    type: object
  auth.DemoLoginResponse:
    properties:
      code:
        type: integer
      isNew:
        type: boolean
      message:
        type: string
      role:
        type: string
      token:
        type: string
      userId:
        type: string
      username:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  auth.SendCodeRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  auth.SendCodeResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  auth.VerifyCodeRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  auth.VerifyCodeResponse:
    properties:
      code:
        type: integer
      isNewUser:
        description: 是否新用户（首次注册）
        type: boolean
      message:
        type: string
      token:
        type: string
      username:
        type: string
    type: object
  auth.WechatLoginData:
    properties:
      isBound:
        type: boolean
      openId:
        type: string
      supplierInfo:
        description: 内部系统 BC_Customer_GetByWeChat 返回的 data 数组，未绑定时为 []
      token:
        type: string
    type: object
  auth.WechatLoginRequest:
    properties:
      code:
        type: string
      userInfo: {}
    required:
    - code
    type: object
  auth.WechatLoginResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/auth.WechatLoginData'
      message:
        type: string
    type: object
  client.ClientProfile:
    properties:
      address:
        type: string
      companyName:
        type: string
      contactName:
        type: string
      createdAt:
        type: string
      id:
        description: equals users.id
        type: string
      industry:
        type: string
      updatedAt:
        type: string
      userId:
        description: equals ID, kept for clarity
        type: string
    type: object
  client.ClientProfileResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/client.ClientProfile'
      message:
        type: string
    type: object
  client.CreateClientProfileRequest:
    properties:
      address:
        type: string
      companyName:
        type: string
      contactName:
        type: string
      industry:
        type: string
    required:
    - address
    - companyName
    - contactName
    - industry
    type: object
  client.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  proxy.BaseResponse:
    properties:
      data: {}
      isSucceed:
        type: boolean
      message:
        type: string
      outData: {}
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.BindWeChatOutData:
    properties:
      intRetVal:
        type: integer
      strMessage:
        type: string
    type: object
  proxy.BindWeChatRequest:
    properties:
      CustomerCode:
        example: PD0201
        type: string
      Mobile:
        example: "13800138000"
        type: string
      Openid:
        example: oXxx123abc
        type: string
      Type:
        description: 0:公众号 1:小程序
        example: "1"
        type: string
    type: object
  proxy.BindWeChatResponse:
    properties:
      data:
        description: 'TODO: 待补充'
      isSucceed:
        type: boolean
      message:
        type: string
      outData:
        $ref: '#/definitions/proxy.BindWeChatOutData'
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.GetByWeChatOutData:
    properties:
      intRetVal:
        type: integer
    type: object
  proxy.GetByWeChatRequest:
    properties:
      Openid:
        example: oXxx123abc
        type: string
      Type:
        description: 0:公众号 1:小程序
        example: "1"
        type: string
    type: object
  proxy.GetByWeChatResponse:
    properties:
      data:
        description: 'TODO: 待补充（空数组=未绑定，有数据=已绑定）'
      isSucceed:
        type: boolean
      message:
        type: string
      outData:
        $ref: '#/definitions/proxy.GetByWeChatOutData'
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.InquiryBySupplierQuotedRequest:
    properties:
      Supplier:
        example: C001
        type: string
    type: object
  proxy.InquiryBySupplierQuotedResponse:
    properties:
      data: {}
      isSucceed:
        type: boolean
      message:
        type: string
      outData: {}
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.InquiryDetailOutData:
    properties:
      strMessage:
        type: string
    type: object
  proxy.InquiryDetailRequest:
    properties:
      InquiryId:
        example: INQ-2024-001
        type: string
      Supplier:
        example: C001
        type: string
    type: object
  proxy.InquiryDetailResponse:
    properties:
      data:
        description: 'TODO: 待补充'
      isSucceed:
        type: boolean
      message:
        type: string
      outData:
        $ref: '#/definitions/proxy.InquiryDetailOutData'
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.InquiryQueryRequest:
    properties:
      BeginDate:
        description: 发布开始时间，可选
        example: ""
        type: string
      EndDate:
        description: 发布结束时间，可选
        example: ""
        type: string
      IncludeEnd:
        description: 是否包含已截止 1:包含 0:不包含
        example: "0"
        type: string
      P_chnName:
        description: 产品名称，模糊查询，可选
        example: ""
        type: string
      Supplier:
        example: C001
        type: string
    type: object
  proxy.InquiryQueryResponse:
    properties:
      data:
        description: 'TODO: 待补充'
      isSucceed:
        type: boolean
      message:
        type: string
      outData: {}
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.QuoteDeleteOutData:
    properties:
      strMessage:
        type: string
    type: object
  proxy.QuoteDeleteRequest:
    properties:
      OperateType:
        description: Cancel:撤回 Delete:删除
        example: Cancel
        type: string
      QuoteId:
        example: QT-2024-001
        type: string
      Supplier:
        example: C001
        type: string
    type: object
  proxy.QuoteDeleteResponse:
    properties:
      data:
        description: 'TODO: 待补充'
      isSucceed:
        type: boolean
      message:
        type: string
      outData:
        $ref: '#/definitions/proxy.QuoteDeleteOutData'
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  proxy.QuoteSaveOutData:
    properties:
      ReturnId:
        type: string
      strMessage:
        type: string
    type: object
  proxy.QuoteSaveRequest:
    properties:
      Id:
        description: 空=新增
        example: ""
        type: string
      InquiryId:
        example: INQ-2024-001
        type: string
      LeadDays:
        example: 7
        type: integer
      LeadTimeStartDate:
        example: "1"
        type: string
      Payment:
        example: 货到付款
        type: string
      Price:
        example: "13.00"
        type: string
      QStatus:
        description: 0:草稿 1:已撤回 2:已提交
        example: "0"
        type: string
      QuoteJson:
        example: ""
        type: string
      Remark:
        example: ""
        type: string
      StockStatus:
        example: "1"
        type: string
      Supplier:
        example: C001
        type: string
      TaxRate:
        example: "0.13"
        type: string
      Unit:
        example: 个
        type: string
      isShipping:
        example: "1"
        type: string
      isTax:
        example: "1"
        type: string
    type: object
  proxy.QuoteSaveResponse:
    properties:
      data:
        description: 'TODO: 待补充'
      isSucceed:
        type: boolean
      message:
        type: string
      outData:
        $ref: '#/definitions/proxy.QuoteSaveOutData'
      statusCode:
        type: integer
      time:
        type: integer
    type: object
  supplier.CapabilitiesResponse:
    properties:
      code:
        type: integer
      data:
        additionalProperties:
          type: integer
        type: object
      message:
        type: string
    type: object
  supplier.CreateSupplierRequest:
    properties:
      capabilities:
        additionalProperties:
          type: integer
        description: 机器能力 {a:1, b:2}
        type: object
      companyName:
        type: string
      companyType:
        type: string
    required:
    - companyName
    - companyType
    type: object
  supplier.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  supplier.SupplierFullInfo:
    properties:
      capabilities:
        additionalProperties:
          type: integer
        description: 生产能力
        type: object
      info:
        allOf:
        - $ref: '#/definitions/supplier.SupplierInfo'
        description: 企业信息
      qualification:
        allOf:
        - $ref: '#/definitions/supplier.SupplierQualification'
        description: 资质信息
    type: object
  supplier.SupplierFullInfoResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/supplier.SupplierFullInfo'
      message:
        type: string
    type: object
  supplier.SupplierInfo:
    properties:
      companyName:
        type: string
      companyType:
        type: string
      createdAt:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  supplier.SupplierProfile:
    properties:
      companyName:
        description: 企业名称
        type: string
      companyType:
        description: 企业类型
        type: string
      createdAt:
        type: string
      id:
        description: equals users.id
        type: string
      updatedAt:
        type: string
      userId:
        description: 关联用户，唯一索引
        type: string
    type: object
  supplier.SupplierProfileResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/supplier.SupplierProfile'
      message:
        type: string
    type: object
  supplier.SupplierQualification:
    type: object
  supplier.UpdateCapabilitiesRequest:
    properties:
      capabilities:
        additionalProperties:
          type: integer
        type: object
    required:
    - capabilities
    type: object
info:
  contact: {}
  description: fantasy对外
  title: Fantasy Bounty API
  version: "1.0"
paths:
  /api/v1/auth/demo-login:
    post:
      consumes:
      - application/json
      description: 使用手机号 + 角色(supplier/client) 直接获取外部 JWT（不会发送验证码）
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.DemoLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.DemoLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Demo 手机号登录（仅测试用）
      tags:
      - auth
  /api/v1/auth/send-code:
    post:
      consumes:
      - application/json
      description: 向手机号发送登录/注册验证码
      parameters:
      - description: 手机号
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SendCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 发送验证码
      tags:
      - auth
  /api/v1/auth/verify-code:
    post:
      consumes:
      - application/json
      description: 通过手机号和验证码进行登录，若手机号未注册则自动注册
      parameters:
      - description: 手机号和验证码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.VerifyCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 验证码登录/注册
      tags:
      - auth
  /api/v1/auth/wechat-login:
    post:
      consumes:
      - application/json
      description: 用前端临时 code 换取 openid，再查询内部系统中该 openid 绑定的供应商信息
      parameters:
      - description: 微信登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.WechatLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.WechatLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 微信小程序登录
      tags:
      - auth
  /api/v1/client/profile:
    get:
      description: 获取当前登录 client 的档案信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.ClientProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      summary: 获取客户档案
      tags:
      - client
    post:
      consumes:
      - application/json
      description: 创建或更新当前登录 client 的公司信息
      parameters:
      - description: 客户档案信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateClientProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.ClientProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      summary: 创建或更新客户档案
      tags:
      - client
  /api/v1/proxy/supplier/bind-wechat:
    post:
      consumes:
      - application/json
      description: 验证供应商身份并绑定 OpenId，成功后 isSucceed=true
      parameters:
      - description: 绑定参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.BindWeChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.BindWeChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 微信端绑定供应商
      tags:
      - proxy
  /api/v1/proxy/supplier/get-by-wechat:
    post:
      consumes:
      - application/json
      description: data 有数据=已绑定供应商；data 为空数组=未绑定；isSucceed=false 看 message
      parameters:
      - description: 查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.GetByWeChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.GetByWeChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 根据 Openid 获取供应商信息
      tags:
      - proxy
  /api/v1/proxy/supplier/inquiry-detail:
    post:
      consumes:
      - application/json
      parameters:
      - description: 查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.InquiryDetailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.InquiryDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 供应商查看采购需求详情及报价情况
      tags:
      - proxy
  /api/v1/proxy/supplier/inquiry-query:
    post:
      consumes:
      - application/json
      parameters:
      - description: 查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.InquiryQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.InquiryQueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 查询供应商可报价的招标信息
      tags:
      - proxy
  /api/v1/proxy/supplier/inquiry-quoted:
    post:
      consumes:
      - application/json
      description: 返回该供应商已提交过报价的询价单列表
      parameters:
      - description: 查询参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.InquiryBySupplierQuotedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.InquiryBySupplierQuotedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 查询供应商已报价的采购单
      tags:
      - proxy
  /api/v1/proxy/supplier/quote-delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 操作参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.QuoteDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.QuoteDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 撤回或删除供应商报价
      tags:
      - proxy
  /api/v1/proxy/supplier/quote-save:
    post:
      consumes:
      - application/json
      parameters:
      - description: 报价参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proxy.QuoteSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proxy.QuoteSaveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proxy.BaseResponse'
      summary: 供应商提交或保存报价
      tags:
      - proxy
  /api/v1/supplier/capabilities:
    post:
      consumes:
      - application/json
      description: 更新供应商的机器设备数量（增量更新）
      parameters:
      - description: 机器能力信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/supplier.UpdateCapabilitiesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supplier.CapabilitiesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/supplier.ErrorResponse'
      summary: 更新机器能力
      tags:
      - supplier
  /api/v1/supplier/full-info:
    get:
      description: 获取供应商的企业信息、资质和生产能力
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supplier.SupplierFullInfoResponse'
      summary: 获取供应商完整信息
      tags:
      - supplier
  /api/v1/supplier/profile:
    get:
      description: 获取当前用户的供应商档案信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supplier.SupplierProfileResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/supplier.ErrorResponse'
      summary: 获取供应商档案
      tags:
      - supplier
    post:
      consumes:
      - application/json
      description: 创建或更新供应商的企业信息和机器能力
      parameters:
      - description: 供应商信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/supplier.CreateSupplierRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supplier.SupplierProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/supplier.ErrorResponse'
      summary: 创建/更新供应商档案
      tags:
      - supplier
swagger: "2.0"
